# Optional Traefik integration shared by local and production deployments. Use
# this together with docker-compose.yml; do not use the standalone override.

services:
  render:
    networks:
      - traefik-public
    labels:
      traefik.enable: 'true'
      traefik.docker.network: traefik-public
      traefik.http.routers.playwright.rule: 'Host(`${APP_HOST:?Set APP_HOST in .env}`)'
      traefik.http.routers.playwright.entrypoints: web
      traefik.http.routers.playwright.middlewares: playwright-compress@docker
      traefik.http.services.playwright.loadbalancer.server.port: '3000'
      # Images, PDFs and tile zips are compressed already, so recompressing them
      # only spends CPU. Rendered HTML and MHTML shrink several-fold.
      traefik.http.middlewares.playwright-compress.compress.includedcontenttypes: text/html,application/x-mimearchive
      # No sticky cookie: every render is one self-contained request, so during a
      # LIVE deploy it does not matter which release answers it.

networks:
  traefik-public:
    external: true
