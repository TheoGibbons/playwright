name: Deploy to AWS Lambda

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: playwright-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # to assume the AWS role through GitHub's OIDC provider

jobs:
  deploy:
    # Skipped until "Push-to-deploy" in README.md has been set up.
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # Code only: infrastructure and .env.production settings are deployed
      # from your own machine.
      - name: Deploy
        run: bash scripts/deploy.sh --code-only
