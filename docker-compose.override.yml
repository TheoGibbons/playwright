# Automatically loaded by plain `docker compose` commands. This is the portable
# standalone experience for users who do not run the shared Traefik stack.
#
# 3088 is this project's allocation on the shared instance; every published host
# port there has to be unique or the container will not start.

services:
  render:
    ports:
      - '${APP_BIND:-127.0.0.1}:${APP_PORT:-3088}:3000'
