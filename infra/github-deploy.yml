AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Role that GitHub Actions assumes to push-deploy the render service. It can
  push an image and point the function at it, and nothing else: infrastructure,
  configuration and the spend limit change only through a deploy from your own
  machine. Deploy once, as stack playwright-github-deploy (README.md).

Parameters:
  Repository:
    Type: String
    Default: TheoGibbons/playwright
    Description: GitHub repository, as owner/name.

Resources:
  Role:
    Type: AWS::IAM::Role
    Properties:
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Only jobs that run in the repository's production environment.
                token.actions.githubusercontent.com:sub: !Sub repo:${Repository}:environment:production
      Policies:
        - PolicyName: deploy-code
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !Sub arn:${AWS::Partition}:ecr:us-east-1:${AWS::AccountId}:repository/playwright
              # scripts/deploy.sh --code-only updates the stack with its previous
              # template and parameters and a new ImageUri. CloudFormation acts
              # with this role's permissions, so any other change fails.
              - Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:GetTemplate
                  - cloudformation:UpdateStack
                Resource: !Sub arn:${AWS::Partition}:cloudformation:us-east-1:${AWS::AccountId}:stack/playwright/*
              - Effect: Allow
                Action:
                  - lambda:Get*
                  - lambda:List*
                  - lambda:UpdateFunctionCode
                Resource: !Sub arn:${AWS::Partition}:lambda:us-east-1:${AWS::AccountId}:function:playwright-render
              # In case CloudFormation resubmits the function's role with the
              # code. That role can only write logs.
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/playwright-RenderRole-*
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com

Outputs:
  RoleArn:
    Value: !GetAtt Role.Arn
