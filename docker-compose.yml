# Runs the image that Lambda runs on this machine, for development. LIVE is
# deployed with scripts/deploy.sh instead; see README.md.

services:
  render:
    build: .
    image: render-service
    restart: unless-stopped
    env_file: .env
    # Loopback only: nothing beyond this machine can reach it.
    ports:
      - '127.0.0.1:${RENDER_PORT:-3000}:3000'
    shm_size: 1gb
    mem_limit: 2g
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 70s # lets in-flight renders (JOB_TIMEOUT_MS) finish
